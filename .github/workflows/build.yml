name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # one platform failing shouldn't cancel the others mid-build — this is
      # exactly what happened when macOS's codesign step failed and GitHub's
      # default fail-fast killed the still-running Windows job before it
      # ever got a chance to finish.
      fail-fast: false
      matrix:
        os:
          [
            # windows-latest currently points at a runner image whose
            # Visual Studio version node-gyp doesn't recognize yet
            # ("find VS ... unknown version undefined"), breaking the
            # grandiose/macadam native builds — pinned to windows-2022 to
            # match the known-working runner release.yml already uses.
            windows-2022,
            macos-latest,
            ubuntu-latest
          ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node_modules itself (not just npm's download cache, which
      # setup-node's cache:npm above already covers) - this is what actually
      # avoids the slow part: grandiose's native NDI SDK download+compile,
      # which otherwise reruns from scratch on every single run, twice (once
      # here for the system Node ABI, again inside `npm run pack` below for
      # Electron's own Node ABI - @electron/rebuild skips modules it finds
      # already built for the target ABI, so restoring node_modules from
      # cache benefits both compiles, not just this first one).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      # electron-builder's own download cache (the Electron zip itself,
      # winCodeSign tools, icon bundles, etc.) - separate from node_modules,
      # re-downloaded every run otherwise regardless of whether any code
      # changed.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-cache-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Build app
        run: npm run build

      # `npm run build` only compiles the source (frontend/electron/servers)
      # — it never invokes electron-builder, so on its own there's nothing
      # installable to download. `npm run release` does invoke it, but
      # requires Windows/macOS code-signing secrets (Azure Trusted Signing,
      # Apple notarization) that aren't configured on this fork and would
      # fail here. `pack` (--dir mode) assembles a real, runnable app folder
      # via electron-builder without building an installer or attempting
      # real code signing. macOS still ran its custom afterSign hook
      # (scripts/macos/notarize.js) unconditionally though, which hard-
      # failed with no Apple credentials set — fixed at the source (that
      # script now skips notarizing when APPLE_ID etc. aren't present).
      # CSC_IDENTITY_AUTO_DISCOVERY=false just avoids searching for a real
      # signing identity that isn't there.
      - name: Package app (unsigned, unpacked)
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeshow-${{ matrix.os }}
          path: dist/
          retention-days: 7
