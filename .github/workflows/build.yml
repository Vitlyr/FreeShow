name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # one platform failing shouldn't cancel the others mid-build — this is
      # exactly what happened when macOS's codesign step failed and GitHub's
      # default fail-fast killed the still-running Windows job before it
      # ever got a chance to finish.
      fail-fast: false
      matrix:
        os:
          [
            # windows-latest currently points at a runner image whose
            # Visual Studio version node-gyp doesn't recognize yet
            # ("find VS ... unknown version undefined"), breaking the
            # grandiose/macadam native builds — pinned to windows-2022 to
            # match the known-working runner release.yml already uses.
            windows-2022,
            macos-latest,
            ubuntu-latest
          ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      # `npm run build` only compiles the source (frontend/electron/servers)
      # — it never invokes electron-builder, so on its own there's nothing
      # installable to download. `npm run release` does invoke it, but
      # requires Windows/macOS code-signing secrets (Azure Trusted Signing,
      # Apple notarization) that aren't configured on this fork and would
      # fail here. `pack` (--dir mode) assembles a real, runnable app
      # folder via electron-builder without building an installer, and
      # normally skips signing entirely with no cert configured — except on
      # macOS, which still auto-applies an ad-hoc self-signature (required
      # for arm64 to even run) and that step failed outright on the
      # macos-latest (Apple Silicon) runner: "code has no resources but
      # signature indicates they must be present". CSC_IDENTITY_AUTO_DISCOVERY
      # =false turns off electron-builder's signing pass altogether,
      # including that ad-hoc fallback.
      - name: Package app (unsigned, unpacked)
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeshow-${{ matrix.os }}
          path: dist/
          retention-days: 7
