name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          [
            # windows-latest currently points at a runner image whose
            # Visual Studio version node-gyp doesn't recognize yet
            # ("find VS ... unknown version undefined"), breaking the
            # grandiose/macadam native builds — pinned to windows-2022 to
            # match the known-working runner release.yml already uses.
            windows-2022,
            macos-latest,
            ubuntu-latest
          ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
